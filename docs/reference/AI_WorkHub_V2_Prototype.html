let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){state=initial()}
if(!state.data||!I[state.lang]||!companyTypes.includes(state.org))state=initial();
const app=document.getElementById('app');
const t=k=>I[state.lang][k]||k;
const txt=v=>typeof v==='object'&&v!==null?(v[state.lang]||v.zh||v.en||''):String(v??'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>state.data[state.org];
let storageAvailable=true;try{localStorage.setItem('__workhub_storage_probe','1');localStorage.removeItem('__workhub_storage_probe')}catch(e){storageAvailable=false}
const store=()=>{if(!storageAvailable)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageAvailable=false}};
const id=()=>Date.now().toString(36).toUpperCase().slice(-6);
const iconMap={dashboard:'◫',cases:'▤',knowledge:'▧',tools:'⚒',analysis:'◷',settings:'⚙'};
const h=(s)=>esc(s);
const statusLabel=s=>t(s==='progress'?'progress':s==='done'?'done':'open');
const ts=()=>new Date().toLocaleString(state.lang==='zh'?'zh-CN':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(s){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function top(){return `<div class="topbar"><div class="top-left">${h(t('topTag'))}<strong>${h(t(state.page))}</strong></div><div class="top-actions"><span class="pill">● ${h(t('offline'))}</span><select aria-label="Company workspace" id="orgSelect">${companyTypes.map((k,i)=>`<option value="${k}" ${k===state.org?'selected':''}>${h(t('orgs')[i])}</option>`).join('')}</select><div class="lang" role="group" aria-label="Interface language"><button type="button" data-lang="zh" class="${state.lang==='zh'?'active':''}" aria-pressed="${state.lang==='zh'}">中文</button><button type="button" data-lang="en" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">EN</button></div></div></div>`}
function shell(inner){let nav=['dashboard','cases','knowledge','tools','analysis','settings'];app.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">W</div><div><div class="brandmain">AI WorkHub</div><div class="brandsub">${h(t('brandSub'))}</div></div></div><div><div class="section-label">${h(t('navTag'))}</div><nav class="nav">${nav.map(k=>`<button data-page="${k}" class="${state.page===k?'active':''}"><span class="ic">${iconMap[k]}</span><span>${h(t(k))}</span></button>`).join('')}</nav></div><div class="side-footer"><strong>● ${h(t('demo'))}</strong>${h(t('demoNote'))}</div></aside><main class="main">${top()}<div class="workspace">${inner}<div class="bottomnote">AI WorkHub V2.0 · ${h(t('sampleCopy'))} · ${h(t('engineOff'))}${storageAvailable?'':(' · '+(state.lang==='zh'?'当前预览环境禁止本地存储，刷新后修改可能丢失':'Local storage is unavailable; changes may be lost on refresh'))}</div></div></main></div>`}
function head(title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">AI WORKHUB / ${h(t('demo'))}</div><h1>${h(t(title))}</h1><p class="lead">${h(t(desc))}</p></div>${action}</div>`}
function metric(title,val){return `<div class="panel metric"><div class="label">${h(t(title))}</div><div class="num">${val}</div><div class="hint">${h(t('statHint'))}</div></div>`}
function caseLabel(c){return h(txt(c.customer))}
function caseListItem(c){return `<button class="listrow ${state.selected===c.id?'selected':''}" data-case="${h(c.id)}"><div class="avatar">${h(txt(c.customer).slice(0,1).toUpperCase())}</div><div class="listtext"><strong>${caseLabel(c)}</strong><small>${h(txt(c.topic))} · ${h(c.channel)}</small></div><span class="tag ${c.status==='done'?'ok':c.status==='open'?'open':''}">${h(statusLabel(c.status))}</span></button>`}
function dashboard(){const d=current();const open=d.cases.filter(x=>x.status!=='done').length;const recent=d.cases.slice(0,4);const r=t('reqs')[state.org];shell(head('overviewTitle','overviewDesc',`<button class="btn primary" data-page="cases" data-new="1">＋ ${h(t('startCase'))}</button>`)+`<div class="grid" style="margin-bottom:17px">${metric('totalCases',d.cases.length)}${metric('openCases',open)}${metric('doneCases',d.cases.length-open)}${metric('knowledgeCount',d.products.length)}</div><div class="panel" style="margin-bottom:17px"><div class="sectionhead"><div><h2>${h(t('quickStart'))}</h2><p>${h(t('quickStartDesc'))}</p></div></div><div class="steps">${['s1','s2','s3','s4'].map((x,i)=>`<div class="step"><div class="n">0${i+1} / 04</div><strong>${h(t(x))}</strong><small>${h(t(x+'d'))}</small></div>`).join('')}</div></div><div class="split-even"><div class="panel"><div class="sectionhead"><div><h2>${h(t('recentCases'))}</h2></div><button class="btn sm" data-page="cases">${h(t('seeAll'))} →</button></div>${recent.length?recent.map(caseListItem).join(''):`<div class="empty">${h(t('noCases'))}</div>`}<div class="flex" style="margin-top:14px"><button class="btn soft" data-page="analysis">${h(t('startAnalysis'))}</button><button class="btn" data-page="knowledge">${h(t('goKnowledge'))}</button></div></div><div class="panel"><div class="sectionhead"><div><h2>${h(t('needCheck'))}</h2><p>${h(t('needCheckDesc'))}</p></div></div><div class="checklist">${r.map(x=>`<div class="checkitem"><span class="dot">?</span>${h(x)}</div>`).join('')}</div><div class="divider"></div><div class="tiny-label">${h(t('workflowRules'))}</div><div class="smallprint">• ${h(t('w1'))}<br/>• ${h(t('w2'))}<br/>• ${h(t('w3'))}</div></div></div>`)}
function caseForm(){return `<div class="panel" style="margin-bottom:17px"><div class="sectionhead"><h2>${h(t('newCase'))}</h2><button class="btn sm" data-action="close-case">× ${h(t('closeForm'))}</button></div><div class="notice warn" style="margin-bottom:14px">${h(t('caseNewHint'))} ${h(t('demoNote'))}</div><form id="newCaseForm"><div class="formgrid"><div class="field"><label for="f_customer">${h(t('customer'))} *</label><input id="f_customer" name="customer" maxlength="100" required /></div><div class="field"><label for="f_product">${h(t('product'))} *</label><input id="f_product" name="topic" maxlength="120" required /></div><div class="field"><label for="f_channel">${h(t('channel'))}</label><select id="f_channel" name="channel"><option value="WhatsApp">WhatsApp</option><option value="Email">${h(t('channelEmail'))}</option><option value="Wechat">${h(t('channelWechat'))}</option><option value="Other">${h(t('channelOther'))}</option></select></div><div class="field"><label for="f_priority">${h(t('priority'))}</label><select id="f_priority" name="priority"><option value="normal">${h(t('normal'))}</option><option value="high">${h(t('high'))}</option></select></div><div class="field full"><label for="f_message">${h(t('message'))} *</label><textarea id="f_message" maxlength="4000" name="message" required></textarea></div></div><div class="flex"><button class="btn primary" type="submit">＋ ${h(t('submit'))}</button><button class="btn" type="button" data-action="close-case">${h(t('cancel'))}</button></div></form></div>`}
function selectedCase(){return current().cases.find(x=>x.id===state.selected)||current().cases[0]}
function detail(c){if(!c)return `<div class="panel empty">${h(t('noSelected'))}</div>`;const req=t('reqs')[state.org];const reply=t('replies')[state.org];const next=t('nexts')[state.org];return `<div class="panel"><div class="detail-title"><div><div class="tiny-label">${h(t('caseID'))} · ${h(c.id)}</div><h2>${caseLabel(c)}</h2><div class="muted" style="font-size:12px">${h(txt(c.topic))} · ${h(c.channel)}</div></div><span class="pill ${c.status==='done'?'':'warn'}">${h(statusLabel(c.status))}</span></div><div class="divider"></div><div class="tiny-label">${h(t('clientOriginal'))}</div><div class="quote">${h(txt(c.message))}</div><div class="divider"></div><div class="sectionhead"><h2>${h(t('requirements'))}</h2></div><div class="checklist">${req.map(x=>`<div class="checkitem"><span class="dot">?</span><span>${h(x)}</span></div>`).join('')}</div><p class="smallprint">${h(t('requiredHint'))}</p><div class="divider"></div><div class="tiny-label">${h(t('templateReply'))}</div><div class="reply" id="currentReply">${h(reply)}</div><p class="smallprint">${h(t('replyHint'))}</p><div class="flex"><button class="btn primary" data-action="copy-reply">${h(t('copyReply'))}</button><button class="btn" data-action="copy-case-prompt">${h(t('copyPrompt'))}</button></div><div class="divider"></div><div class="tiny-label">${h(t('nextAction'))}</div><div class="notice">${h(next)}</div><div class="flex" style="margin-top:13px"><button class="btn" data-action="status-progress">${h(t('markProgress'))}</button><button class="btn soft" data-action="status-done">✓ ${h(t('markDone'))}</button><button class="btn" data-action="status-open">${h(t('markOpen'))}</button></div><div class="divider"></div><div class="tiny-label">${h(t('followUp'))}</div><form id="followForm"><div class="field"><textarea name="note" rows="2" maxlength="1400" placeholder="${h(t('followUpPlaceholder'))}" required></textarea></div><button class="btn soft" type="submit">＋ ${h(t('saveFollowUp'))}</button></form><div class="tiny-label" style="margin-top:20px">${h(t('history'))}</div>${(c.notes||[]).length?c.notes.map(n=>`<div class="checkitem" style="margin-bottom:8px"><span class="dot">✓</span><div>${h(n.text)}<div class="smallprint">${h(n.time)}</div></div></div>`).join(''):`<p class="smallprint">${h(t('noHistory'))}</p>`}</div>`}
function cases(){const d=current();if(!state.selected&&d.cases.length)state.selected=d.cases[0].id;const filtered=state.filter==='all'?d.cases:d.cases.filter(c=>c.status===state.filter);shell(head('casesTitle','casesDesc',`<button class="btn primary" data-action="new-case">＋ ${h(t('newCase'))}</button>`)+(state.showCaseForm?caseForm():'')+`<div class="split"><div class="panel"><div class="sectionhead"><h2>${h(t('caseQueue'))}</h2><select id="caseFilter" aria-label="Filter cases"><option value="all">${h(t('all'))}</option><option value="open" ${state.filter==='open'?'selected':''}>${h(t('open'))}</option><option value="progress" ${state.filter==='progress'?'selected':''}>${h(t('progress'))}</option><option value="done" ${state.filter==='done'?'selected':''}>${h(t('done'))}</option></select></div>${filtered.length?filtered.map(caseListItem).join(''):`<div class="empty">${h(t('noCases'))}</div>`}</div>${detail(selectedCase())}</div>`)}
function knowledge(){const d=current();let q=state.knowledgeSearch||'';const filtered=d.products.filter(p=>(txt(p.name)+' '+p.sku+' '+txt(p.summary)).toLowerCase().includes(q.toLowerCase()));shell(head('knowledgeTitle','knowledgeDesc',`<button class="btn primary" data-action="toggle-kb">＋ ${h(t('addKnowledge'))}</button>`)+(state.showKnowledgeForm?`<div class="panel" style="margin-bottom:17px"><div class="sectionhead"><h2>${h(t('addKnowledge'))}</h2><button class="btn sm" data-action="toggle-kb">×</button></div><form id="knowledgeForm"><div class="formgrid"><div class="field"><label>${h(t('name'))} *</label><input name="name" required maxlength="120" /></div><div class="field"><label>${h(t('sku'))} *</label><input name="sku" maxlength="80" required /></div><div class="field full"><label>${h(t('summary'))} *</label><textarea name="summary" maxlength="4000" required></textarea></div><div class="field full"><label>${h(t('source'))}</label><input name="source" maxlength="180" /></div></div><p class="infochip">${h(t('newDocNote'))}</p><button class="btn primary" type="submit" style="margin-top:12px">${h(t('save'))}</button></form></div>`:'')+`<div class="panel" style="margin-bottom:16px"><div class="flex between"><div><strong>${h(t('knowledgeList'))}</strong><div class="smallprint">${h(t('compareNote'))}</div></div><div style="width:min(100%,300px)"><input id="knowledgeSearch" placeholder="${h(t('search'))}" value="${h(q)}" /></div></div></div><div class="cards">${filtered.map(p=>`<div class="panel product"><span class="sku">${h(p.sku)}</span><h3>${h(txt(p.name))}</h3><p>${h(txt(p.summary))}</p><div class="smallprint">${h(t('source'))}: ${h(p.source||'—')}</div><div class="verified"><span class="pill ${p.verified?'':'warn'}">${h(t(p.verified?'verified':'unverified'))}</span></div></div>`).join('')||`<div class="empty">${h(t('noKnowledge'))}</div>`}</div>`)}
function promptFor(c,type){const lines=[];if(state.lang==='zh'){
 lines.push('你是企业内部业务辅助工具。只依据已提供的信息分析，禁止编造价格、库存、交期、产品规格或成交结论。');
 lines.push('公司业务：'+t('orgs')[companyTypes.indexOf(state.org)]+'。');
 lines.push('任务：'+({reply:'生成销售回复建议',audit:'诊断销售沟通话术',productCompare:'整理产品信息与待核对参数',content:'生成需人工审核的商品描述'}[type]||type)+'。');
 if(c)lines.push('客户原话：'+txt(c.message),'主题：'+txt(c.topic));
 lines.push('请先明确已知事实与缺失信息。需要产品信息时，只使用我提供的知识条目，未审核的条目不得当作确定事实。');
 }else{
 lines.push('You are an internal business assistant. Use only the information supplied. Never invent prices, stock, delivery dates, technical specifications, or deal outcomes.');
 lines.push('Business: '+t('orgs')[companyTypes.indexOf(state.org)]+'.');
 lines.push('Task: '+({reply:'Draft a customer reply',audit:'Review sales communication',productCompare:'Summarize product facts requiring validation',content:'Draft product listing copy requiring approval'}[type]||type)+'.');
 if(c)lines.push('Customer message: '+txt(c.message),'Topic: '+txt(c.topic));
 lines.push('Separate confirmed facts from missing details. Use supplied product records only and do not treat unreviewed entries as approved facts.');
 }
 const ps=current().products.slice(0,5).map(p=>`${p.sku}: ${txt(p.name)} — ${txt(p.summary)} [${p.verified?'reviewed':'unreviewed'}]`);
 lines.push(state.lang==='zh'?'内部参考资料（仅限以下条目）：':'Reference entries (limited to these items):',...ps);
 lines.push(state.lang==='zh'?'输出格式：1.客户需求 2.缺失信息 3.参考回复 4.下步动作 5.待人工核验的承诺与参数。':'Output: 1. Customer needs 2. Missing details 3. Draft response 4. Next action 5. Claims and specs needing human review.');
 return lines.join('\n');}
function tools(){const d=current();const c=d.cases.find(c=>c.id===state.toolCase)||d.cases[0];const type=state.toolType||'reply';const prompt=promptFor(c,type);shell(head('toolsTitle','toolsDesc')+`<div class="split-even"><div class="panel"><div class="sectionhead"><div><h2>${h(t('promptBuilder'))}</h2><p>${h(t('promptBuilderDesc'))}</p></div></div><div class="field"><label>${h(t('templateType'))}</label><div class="template-buttons">${['reply','audit','productCompare','content'].map(x=>`<button class="btn ${type===x?'active':''}" data-tool="${x}">${h(t(x))}</button>`).join('')}</div></div><div class="field"><label for="toolCase">${h(t('caseSelection'))}</label><select id="toolCase"><option value="">${h(t('chooseCase'))}</option>${d.cases.map(x=>`<option value="${h(x.id)}" ${c?.id===x.id?'selected':''}>${h(txt(x.customer))} / ${h(txt(x.topic))}</option>`).join('')}</select></div><div class="notice">${h(t('w1'))}<br/>${h(t('w2'))}</div></div><div class="panel"><div class="sectionhead"><h2>${h(t('generated'))}</h2><span class="pill slate">${h(t('offline'))}</span></div><textarea id="promptOutput" readonly style="min-height:380px">${h(prompt)}</textarea><div class="flex" style="margin-top:12px"><button class="btn primary" data-action="copy-prompt">${h(t('copy'))}</button><span class="smallprint">${h(t('saveReply'))}</span></div></div></div>`)}
function checklistText(input){return (state.lang==='zh'?'请根据以下清单由人工检查；此处没有调用 AI：':'Please review these points manually; no AI is called here:')+'\n\n'+t('analysisChecks').map((x,i)=>`${i+1}. ${x}`).join('\n')+'\n\n'+(state.lang==='zh'?'待复盘对话：':'Conversation to review:')+'\n'+input}
function analysis(){const d=current();shell(head('analysisTitle','analysisDesc')+`<div class="split-even"><div class="panel"><div class="sectionhead"><h2>${h(t('reviewChecklist'))}</h2></div><p class="smallprint">${h(t('reviewDesc'))}</p><div class="field"><label for="conversation">${h(t('conversation'))}</label><textarea id="conversation" style="min-height:180px" placeholder="${h(t('conversationPH'))}">${h(state.reviewInput||'')}</textarea></div><button class="btn soft" data-action="checklist">${h(t('runChecklist'))}</button><div class="divider"></div><div class="tiny-label">${h(t('reviewResult'))}</div><div class="quote" style="max-height:260px;overflow:auto">${h(state.checklistOutput||t('insightManual'))}</div><div class="divider"></div><form id="reviewForm"><div class="field"><label for="reviewOutput">${h(t('reviewOutput'))}</label><textarea name="result" id="reviewOutput" placeholder="${h(t('reviewOutputPH'))}" required></textarea></div><button class="btn primary" type="submit">${h(t('saveReview'))}</button></form><p class="smallprint">${h(t('reviewNote'))}</p></div><div class="panel"><div class="sectionhead"><h2>${h(t('savedReviews'))} (${d.reviews.length})</h2></div>${d.reviews.length?d.reviews.map(x=>`<div class="checkitem" style="margin-bottom:10px"><span class="dot">✓</span><div style="min-width:0;flex:1"><strong>${h(x.date)}</strong><div style="white-space:pre-wrap;overflow-wrap:anywhere">${h(x.result)}</div><div class="smallprint">${h((x.conversation||'').slice(0,85))}</div></div></div>`).join(''):`<div class="empty"><div class="symbol">▤</div>${h(t('noReviews'))}</div>`}</div></div>`)}
function settings(){const d=current();shell(head('settingsTitle','settingsDesc')+`<div class="split-even"><div class="panel"><div class="sectionhead"><h2>${h(t('orgInfo'))}</h2></div><div class="flex"><span class="pill">${h(t('orgs')[companyTypes.indexOf(state.org)])}</span><span class="pill slate">${h(t('engineOff'))}</span></div><div class="divider"></div><div class="tiny-label">${h(t('languages'))}</div><p class="muted">${h(t('languagesDesc'))}</p><div class="tiny-label">${h(t('storage'))}</div><p class="muted">${h(t('storageDesc'))}</p><div class="flex"><button class="btn soft" data-action="export">↧ ${h(t('export'))}</button><button class="btn danger" data-action="reset">↺ ${h(t('reset'))}</button></div></div><div class="panel"><div class="sectionhead"><h2>${h(t('about'))}</h2></div><p>${h(t('aboutDesc'))}</p><div class="divider"></div><div class="tiny-label">${h(t('statsTitle'))}</div><p class="smallprint">${h(t('statsDesc'))}</p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('totalCases',d.cases.length)}${metric('knowledgeCount',d.products.length)}${metric('reviewCount',d.reviews.length)}${metric('doneCases',d.cases.filter(x=>x.status==='done').length)}</div><p class="smallprint">${h(t('timeWarning'))}</p></div></div><div class="panel" style="margin-top:16px"><div class="sectionhead"><h2>${h(t('legal'))}</h2></div><p class="infochip">${h(t('legalDesc'))}</p><div class="tiny-label" style="margin-top:18px">${h(t('roadmap'))}</div><p class="muted">${h(t('roadmapDesc'))}</p></div>`)}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.title=state.lang==='zh'?'AI WorkHub V2 · 企业提效工作台':'AI WorkHub V2 · Business Productivity';({dashboard,cases,knowledge,tools,analysis,settings}[state.page]||dashboard)();store()}
async function copy(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s)}else{const el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove()}toast(t('copyOk'))}catch(e){toast(t('copyFail'))}}
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.lang){state.lang=b.dataset.lang;render();return}
 if(b.dataset.page){state.page=b.dataset.page;state.showCaseForm=b.dataset.new==='1';if(b.dataset.case)state.selected=b.dataset.case;render();return}
 if(b.dataset.case){state.page='cases';state.selected=b.dataset.case;render();return}
 if(b.dataset.tool){state.toolType=b.dataset.tool;render();return}
 const a=b.dataset.action;if(!a)return;
 if(a==='new-case'){state.showCaseForm=true;render()}
 if(a==='close-case'){state.showCaseForm=false;render()}
 if(a==='toggle-kb'){state.showKnowledgeForm=!state.showKnowledgeForm;render()}
 if(a==='copy-reply'){copy(t('replies')[state.org])}
 if(a==='copy-case-prompt'){copy(promptFor(selectedCase(),'audit'))}
 if(a==='copy-prompt'){copy(document.getElementById('promptOutput').value)}
 if(a.startsWith('status-')){const c=selectedCase();if(c){c.status=a.slice(7);c.notes.unshift({text:statusLabel(c.status),time:ts()});render();toast(t('statusUpdated'))}}
 if(a==='checklist'){const value=document.getElementById('conversation').value.trim();if(!value){toast(t('enterConversation'));return}state.reviewInput=value;state.checklistOutput=checklistText(value);render()}
 if(a==='export'){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),note:'Demo browser data only',data:state.data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='AI_WorkHub_demo_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(t('exportDone'))}
 if(a==='reset'){if(confirm(t('resetConfirm'))){state=initial();render();toast(t('resetDone'))}}
});
app.addEventListener('change',ev=>{if(ev.target.id==='orgSelect'){state.org=ev.target.value;state.selected=null;state.showCaseForm=false;state.showKnowledgeForm=false;state.checklistOutput='';state.reviewInput='';render()}if(ev.target.id==='caseFilter'){state.filter=ev.target.value;render()}if(ev.target.id==='toolCase'){state.toolCase=ev.target.value;render()}});
app.addEventListener('input',ev=>{if(ev.target.id==='knowledgeSearch'){state.knowledgeSearch=ev.target.value;const pos=ev.target.selectionStart;render();const input=document.getElementById('knowledgeSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
app.addEventListener('submit',ev=>{ev.preventDefault();const form=ev.target;const val=n=>form.elements.namedItem(n)?.value?.trim()||'';
 if(form.id==='newCaseForm'){if(!val('customer')||!val('topic')||!val('message')){toast(t('emptyInput'));return}const c={id:'C-'+id(),customer:val('customer'),topic:val('topic'),message:val('message'),channel:val('channel'),priority:val('priority'),status:'open',stage:'start',notes:[]};current().cases.unshift(c);state.selected=c.id;state.filter='all';state.showCaseForm=false;render();toast(t('created'))}
 if(form.id==='followForm'){const c=selectedCase();const note=val('note');if(!note||!c)return;c.notes.unshift({text:note,time:ts()});render();toast(t('recordSaved'))}
 if(form.id==='knowledgeForm'){if(!val('name')||!val('sku')||!val('summary')){toast(t('emptyInput'));return}current().products.unshift({id:'P-'+id(),name:val('name'),sku:val('sku'),summary:val('summary'),source:val('source')||'User entry',verified:false});state.showKnowledgeForm=false;render();toast(t('kbSaved'))}
 if(form.id==='reviewForm'){const result=val('result');if(!result){toast(t('saveResultFirst'));return}current().reviews.unshift({id:'R-'+id(),date:ts(),result,conversation:state.reviewInput||''});state.reviewInput='';state.checklistOutput='';render();toast(t('recordSaved'))}
});
render();
})();
</script>
</body>
</html>
