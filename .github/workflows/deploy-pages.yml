name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Pages is static-only: build with the repository sub-path and the
      # browser-local demo backend so no /api requests are made.
      - name: Build demo bundle
        working-directory: frontend
        env:
          VITE_BASE: /AI-tools/
          VITE_DEMO_MODE: "true"
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (Source: GitHub Actions) on first run; repo Settings can still override.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
